<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniRouter — روتر همه‌ی مدل‌ها</title>
<style>
:root{
  --bg:#0b0f17; --bg2:#101725; --card:#151d2e; --card2:#1a2336;
  --line:#24304a; --txt:#e8edf7; --dim:#8b98b4; --acc:#4f8cff; --acc2:#7c5cff;
  --ok:#2fd18c; --warn:#ffb02e; --err:#ff5c74; --mono:'Consolas','Menlo',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:24px 18px 60px}
header{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 6px 24px rgba(79,140,255,.35)}
h1{font-size:22px}
h1 small{color:var(--dim);font-weight:400;font-size:12px;display:block;margin-top:2px}
.top-actions{margin-inline-start:auto;display:flex;gap:8px}
button{background:var(--card2);border:1px solid var(--line);color:var(--txt);padding:9px 16px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13px;transition:.15s}
button:hover{border-color:var(--acc);transform:translateY(-1px)}
button.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;font-weight:700}
button.danger:hover{border-color:var(--err);color:var(--err)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h3{font-size:14px;margin-bottom:12px;color:var(--dim);display:flex;align-items:center;gap:8px}
.card h3 .dot{width:9px;height:9px;border-radius:50%;background:var(--dim)}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)} .dot.err{background:var(--err)}
.pcard{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.prow .models{color:var(--dim);font-size:12px}
.tag{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--bg2);border:1px solid var(--line);color:var(--dim)}
.tag.ok{color:var(--ok);border-color:rgba(47,209,140,.35)}
.tag.err{color:var(--err);border-color:rgba(255,92,116,.35)}
.kbox{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--mono);font-size:12px;direction:ltr;text-align:left;overflow-x:auto;white-space:pre;color:#a8c7ff;cursor:pointer;position:relative}
.kbox:hover{border-color:var(--acc)}
.kbox .copy{position:absolute;top:6px;right:8px;font-size:10px;color:var(--dim);font-family:inherit}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--dim);font-weight:400;text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);font-size:12px}
td{padding:8px 6px;border-bottom:1px solid rgba(36,48,74,.5)}
tr:hover td{background:rgba(79,140,255,.04)}
.badge{font-size:11px;padding:2px 8px;border-radius:6px;background:rgba(79,140,255,.12);color:#8ab4ff}
.badge.custom{background:rgba(124,92,255,.14);color:#b9a3ff}
input,select{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:10px 12px;border-radius:10px;font-family:inherit;font-size:13px;width:100%}
input:focus{outline:none;border-color:var(--acc)}
label{font-size:12px;color:var(--dim);display:block;margin:10px 0 5px}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.muted{color:var(--dim);font-size:12px;line-height:1.9}
.section{margin-bottom:26px}
.section>h2{font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.section>h2::after{content:"";flex:1;height:1px;background:var(--line)}
#login{max-width:380px;margin:12vh auto;text-align:center}
#login .logo{margin:0 auto 18px;width:64px;height:64px;font-size:32px}
.err{color:var(--err);font-size:12px;margin-top:8px;min-height:16px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--acc);padding:10px 22px;border-radius:12px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.logline{font-family:var(--mono);font-size:11px;direction:ltr;text-align:left;padding:6px 8px;border-bottom:1px solid rgba(36,48,74,.4);display:flex;gap:10px;flex-wrap:wrap}
.logline .t{color:var(--dim)} .logline .m{color:#a8c7ff} .logline .p{color:#b9a3ff} .logline .e{color:var(--err)}
.preset{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.preset button{font-size:11px;padding:5px 10px}
footer{text-align:center;color:var(--dim);font-size:11px;margin-top:34px;line-height:2}
a{color:var(--acc);text-decoration:none}
.hidden{display:none!important}
.stat{display:flex;gap:14px;flex-wrap:wrap}
.stat .s{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 18px;flex:1;min-width:120px}
.stat .s b{font-size:20px;display:block}
.stat .s span{color:var(--dim);font-size:11px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h; return d.firstElementChild; };
const toast = (msg) => { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2200); };
let TOKEN = localStorage.getItem('omni_admin') || '';
let ADMIN_PASSWORD_SAVED = localStorage.getItem('omni_pw') || '';

async function api(path, opts={}) {
  const r = await fetch(path, {...opts, headers: {'Content-Type':'application/json', ...(TOKEN?{'Authorization':'Bearer '+TOKEN}:{}) , ...(opts.headers||{})}});
  if (r.status === 401 && path.startsWith('/admin/api')) { TOKEN=''; localStorage.removeItem('omni_admin'); renderLogin(); throw new Error('unauthorized'); }
  return r.json();
}

/* ---------------- Login ---------------- */
function renderLogin(err='') {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const box = $(`
  <div id="login">
    <div class="logo">🌐</div>
    <h1 style="margin-bottom:6px">OmniRouter</h1>
    <p class="muted" style="margin-bottom:18px">روتر یکپارچه‌ی GLM · Qwen · DeepSeek · API دلخواه</p>
    <div class="card">
      <label>رمز مدیریت (ADMIN_PASSWORD)</label>
      <input type="password" id="pw" placeholder="admin" autofocus>
      <div class="err">${err}</div>
      <button class="primary" style="width:100%;margin-top:8px" onclick="doLogin()">ورود</button>
    </div>
  </div>`);
  app.appendChild(box);
  box.querySelector('#pw').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
  box.querySelector('#pw').focus();
}
async function doLogin() {
  const pw = document.getElementById('pw').value;
  const r = await fetch('/admin/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password: pw})});
  const j = await r.json();
  if (!r.ok) { renderLogin(j.error || 'خطا'); return; }
  TOKEN = j.token; localStorage.setItem('omni_admin', TOKEN);
  renderApp();
}

/* ---------------- App shell ---------------- */
function renderApp() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild($(`
  <div class="wrap">
    <header>
      <div class="logo">🌐</div>
      <h1>OmniRouter <small>GLM · Qwen · DeepSeek · هر API دیگه — با یک کلید</small></h1>
      <div class="top-actions">
        <button onclick="refreshAll()">⟳ بروزرسانی</button>
        <button class="danger" onclick="logout()">خروج</button>
      </div>
    </header>

    <div class="section"><h2>نمای کلی</h2>
      <div class="stat" id="stats"></div>
      <div class="grid" id="providers" style="margin-top:14px"></div>
    </div>

    <div class="section"><h2>اتصال کلاینت‌ها (OpenCode / Hermes / Cline / …)</h2>
      <div class="grid">
        <div class="card"><h3>OpenAI سازگار (پیش‌فرض اکثر ابزارها)</h3>
          <div class="kbox" onclick="copyBox(this)">Base URL: <span id="obase"></span>
API Key: sk-… (کلیدها ↓)
Model: auto یا هر مدل از لیست</div>
          <p class="muted" style="margin-top:8px">در Cline / OpenCode / Hermes کافیه Base URL و کلید رو بذاری؛ مدل «auto» بهترین ارائه‌دهنده‌ی سالم رو خودکار انتخاب می‌کنه (با failover).</p>
        </div>
        <div class="card"><h3>Anthropic سازگار (Claude Code و…)</h3>
          <div class="kbox" onclick="copyBox(this)">ANTHROPIC_BASE_URL=<span id="abase"></span>
ANTHROPIC_API_KEY=sk-…</div>
          <p class="muted" style="margin-top:8px">هر دو پروتکل (OpenAI + Anthropic) با استریم و tool calling کامل پشتیبانی می‌شن.</p>
        </div>
      </div>
    </div>

    <div class="section"><h2>مدل‌ها</h2>
      <div class="card"><table id="models"><thead><tr><th>مدل</th><th>ارائه‌دهنده</th></tr></thead><tbody></tbody></table></div>
    </div>

    <div class="section"><h2>کلیدهای API</h2>
      <div class="card">
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <input id="keyname" placeholder="نام کلید (مثلاً opencode)" style="max-width:240px">
          <button class="primary" onclick="createKey()">+ کلید جدید</button>
        </div>
        <table id="keys"><thead><tr><th>کلید</th><th>نام</th><th>درخواست</th><th>خطا</th><th></th></tr></thead><tbody></tbody></table>
      </div>
    </div>

    <div class="section"><h2>ارائه‌دهنده‌های سفارشی (API خودت)</h2>
      <div class="grid">
        <div class="card">
          <h3>افزودن API سازگار با OpenAI</h3>
          <div class="formrow">
            <div><label>نام (اسلاگ)</label><input id="pname" placeholder="gemini"></div>
            <div><label>کلید API</label><input id="pkey" placeholder="AIza…"></div>
          </div>
          <label>Base URL (OpenAI-compatible)</label>
          <input id="purl" placeholder="https://generativelanguage.googleapis.com/v1beta/openai">
          <label>مدل‌ها (با کاما — خالی = fetch خودکار از /v1/models)</label>
          <input id="pmodels" placeholder="gemini-2.5-flash, gemini-2.5-pro">
          <div class="preset">
            <button onclick="preset('gemini','https://generativelanguage.googleapis.com/v1beta/openai','gemini-2.5-flash, gemini-2.5-pro')">✨ Gemini AI Studio</button>
            <button onclick="preset('openai','https://api.openai.com/v1','gpt-4o, gpt-4o-mini')">OpenAI</button>
            <button onclick="preset('openrouter','https://openrouter.ai/api/v1','')">OpenRouter</button>
            <button onclick="preset('groq','https://api.groq.com/openai/v1','')">Groq</button>
          </div>
          <button class="primary" style="width:100%;margin-top:12px" onclick="addProvider()">افزودن ارائه‌دهنده</button>
          <div class="err" id="perr"></div>
        </div>
        <div class="card">
          <h3>لیست ارائه‌دهنده‌های سفارشی</h3>
          <table id="providers2"><thead><tr><th>نام</th><th>Base URL</th><th></th></tr></thead><tbody></tbody></table>
        </div>
      </div>
    </div>

    <div class="section"><h2>لاگ درخواست‌ها (۵۰۰ مورد آخر)</h2>
      <div class="card" id="logs" style="max-height:340px;overflow-y:auto"></div>
    </div>

    <footer>
      OmniRouter v1.0.0 — وب‌تو-API با کیفیت واقعی · ساخته‌شده روی سه بریج اثبات‌شده: glm-free-api · qwen-free-api · deepseek-free-api<br>
      <a href="/health" target="_blank">/health</a> · <a href="/v1/models" target="_blank">/v1/models</a> · <a href="/glm/" target="_blank">/glm/</a> · <a href="/qwen/" target="_blank">/qwen/</a> · <a href="/ds/" target="_blank">/ds/</a>
    </footer>
  </div>`));
  refreshAll();
  setInterval(()=>{ if(TOKEN) refreshAll(true); }, 15000);
}
function logout(){ fetch('/admin/logout',{method:'POST',headers:{'Authorization':'Bearer '+TOKEN}}); TOKEN=''; localStorage.removeItem('omni_admin'); renderLogin(); }

/* ---------------- data rendering ---------------- */
async function refreshAll(quiet) {
  try {
    const o = await api('/admin/api/overview');
    renderOverview(o);
    const m = await api('/admin/api/models');
    renderModels(m.data || []);
  } catch(e) { if(!quiet) toast('خطا در دریافت داده: '+e.message); }
}
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function renderOverview(o) {
  const provs = o.providers || [];
  const keys = o.keys || [];
  const totalReq = keys.reduce((a,k)=>a+(k.requests||0),0);
  const totalErr = keys.reduce((a,k)=>a+(k.errors||0),0);
  const modelCount = provs.reduce((a,p)=>a+(p.models?.length||0),0);
  document.getElementById('stats').innerHTML = `
    <div class="s"><b>${provs.filter(p=>p.healthy).length}/${provs.length}</b><span>ارائه‌دهنده‌ی سالم</span></div>
    <div class="s"><b>${modelCount}</b><span>مدل فعال</span></div>
    <div class="s"><b>${totalReq}</b><span>کل درخواست‌ها</span></div>
    <div class="s"><b>${totalErr}</b><span>خطاها</span></div>`;
  document.getElementById('providers').innerHTML = provs.map(p=>`
    <div class="card pcard">
      <div class="prow"><b>${esc(p.label)}</b>
        <span class="tag ${p.healthy?'ok':'err'}">${p.healthy?'🟢 سالم':'🔴 پاسخ نمی‌دهد'}</span></div>
      <div class="prow"><span class="models">${(p.models||[]).slice(0,4).map(esc).join(' · ')}${(p.models||[]).length>4?' …':''}</span>
        <span class="badge ${p.kind==='custom'?'custom':''}">${esc(p.id)}</span></div>
    </div>`).join('');
  document.getElementById('obase').textContent = location.origin + '/v1';
  document.getElementById('abase').textContent = location.origin;
  // keys
  document.querySelector('#keys tbody').innerHTML = keys.map(k=>`
    <tr><td style="font-family:var(--mono);direction:ltr;font-size:11px" onclick="copyTxt('${k.key}');toast('کپی شد ✓')" title="کلیک = کپی">${esc(k.key.slice(0,14))}…${esc(k.key.slice(-4))}</td>
    <td>${esc(k.name)}</td><td>${k.requests||0}</td><td>${(k.errors||0)?'<span class="tag err">'+k.errors+'</span>':'0'}</td>
    <td><button class="danger" onclick="delKey('${k.key}')">حذف</button></td></tr>`).join('');
  // custom providers
  const cps = (o.custom_raw||[]);
  document.querySelector('#providers2 tbody').innerHTML = cps.length? cps.map(c=>`
    <tr><td><span class="badge custom">${esc(c.name)}</span></td><td style="direction:ltr;text-align:left;font-size:11px;font-family:var(--mono)">${esc(c.base_url)}</td>
    <td><button class="danger" onclick="delProvider('${esc(c.name)}')">حذف</button></td></tr>`).join('')
    : '<tr><td colspan="3" class="muted">هنوز چیزی اضافه نشده — با پیش‌تنظیم Gemini شروع کن</td></tr>';
  // logs
  document.getElementById('logs').innerHTML = (o.logs||[]).length? (o.logs||[]).map(l=>{
    const t = new Date(l.time*1000).toLocaleTimeString('fa-IR');
    return `<div class="logline"><span class="t">${t}</span><span class="m">${esc(l.model)}</span><span class="p">→ ${esc(l.provider)}</span><span class="${l.status<400?'':'e'}">HTTP ${l.status}</span><span class="t">${l.latency_ms}ms${l.stream?' · stream':''}</span>${l.error?`<span class="e">${esc(l.error)}</span>`:''}</div>`;
  }).join('') : '<p class="muted">هنوز درخواستی ثبت نشده</p>';
}
function renderModels(models) {
  document.querySelector('#models tbody').innerHTML = models.map(m=>`
    <tr><td style="font-family:var(--mono);direction:ltr;text-align:left">${esc(m.id)}</td>
    <td><span class="badge ${String(m.owned_by).startsWith('custom')?'custom':''}">${esc(m.owned_by)}</span></td></tr>`).join('');
}

/* ---------------- actions ---------------- */
async function createKey(){
  const name = document.getElementById('keyname').value.trim() || 'key';
  const j = await api('/admin/api/keys',{method:'POST',body:JSON.stringify({name})});
  toast('کلید ساخته شد: '+j.key.key); copyTxt(j.key.key);
  refreshAll();
}
async function delKey(key){ if(!confirm('این کلید حذف شود؟')) return; await api('/admin/api/keys?key='+encodeURIComponent(key),{method:'DELETE'}); refreshAll(); }
function preset(name,url,models){ document.getElementById('pname').value=name; document.getElementById('purl').value=url; document.getElementById('pmodels').value=models; }
async function addProvider(){
  const p = { name:document.getElementById('pname').value.trim(), base_url:document.getElementById('purl').value.trim(),
    api_key:document.getElementById('pkey').value.trim(),
    models:(document.getElementById('pmodels').value.split(',').map(s=>s.trim()).filter(Boolean)) };
  if(!p.name||!p.base_url){ document.getElementById('perr').textContent='نام و Base URL لازم است'; return; }
  const j = await api('/admin/api/providers',{method:'POST',body:JSON.stringify(p)});
  if(j.error){ document.getElementById('perr').textContent=j.error; return; }
  toast('ارائه‌دهنده اضافه شد ✓'); ['pname','purl','pkey','pmodels'].forEach(i=>document.getElementById(i).value='');
  refreshAll();
}
async function delProvider(name){ if(!confirm('حذف '+name+'؟')) return; await api('/admin/api/providers?name='+encodeURIComponent(name),{method:'DELETE'}); refreshAll(); }
function copyBox(el){ navigator.clipboard.writeText(el.innerText.replace(/copy$/,'')).then(()=>toast('کپی شد ✓')); }
function copyTxt(t){ navigator.clipboard.writeText(t).then(()=>toast('کپی شد ✓')).catch(()=>{}); }

/* ---------------- boot ---------------- */
if (TOKEN) { fetch('/admin/api/overview',{headers:{'Authorization':'Bearer '+TOKEN}}).then(r=>{ if(r.status===401){TOKEN='';localStorage.removeItem('omni_admin');renderLogin();} else renderApp(); }).catch(()=>renderLogin()); }
else renderLogin();
</script>
</body>
</html>
